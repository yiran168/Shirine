name: Deploy Shirine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-server:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.server_deploy.outputs.api_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Deploy Backend
        id: server_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ vars.DB_NAME || 'shirine-db' }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'shirine-server' }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'shirine-storage' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CF_TURNSTILE_SECRET: ${{ secrets.CF_TURNSTILE_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          PUBLIC_R2_URL: ${{ secrets.PUBLIC_R2_URL || vars.PUBLIC_R2_URL }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
        run: bun run deploy:server

  deploy-client:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Deploy Frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL || vars.PUBLIC_API_URL }}
          API_URL: ${{ needs.deploy-server.outputs.api_url }}
          PAGES_NAME: ${{ vars.PAGES_NAME || 'shirine' }}
        run: bun run deploy:client

