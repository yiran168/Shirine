name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test, Typecheck, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit Source Syntax and Inventory
        run: bun scripts/audit-source.mjs

      - name: Run Typecheck
        run: bun run check

      - name: Build All Workspaces
        run: bun run build

      - name: Check Cloudflare Pages and Worker Limits
        run: bun scripts/check-cloudflare-limits.mjs

      - name: Run Tests
        run: bun test
