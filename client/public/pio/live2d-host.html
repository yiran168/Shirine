<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  /* Hide vendor tips anchored to the empty canvas, use the measured character instead. */
  div[style*="calc(100%"] { display: none !important; }
</style>
</head>
<body>
<script src="/pio/live2dcubismcore.min.js"></script>
<script src="/pio/live2d.min.js"></script>
<script src="/pio/l2d-widget.min.js"></script>
<script>
  var widgetInstance = null;
  var activeConfigKey = '';
  var loadingConfigKey = '';
  var widgetLoaded = false;
  var baseContentHeight = 500;
  var lastContentHeight = 500;
  var floatingContentPadding = 12;
  var layoutObserver = null;
  var layoutFrame = 0;

  var quotesByLang = {
    zh_CN: [
      '今天也是美好的一天～',
      '欢迎来到 Shirine！',
      '有什么想和我聊聊的吗？',
      '看文章累了就伸个懒腰吧！',
      '点击右边的按钮可以返回顶部哦～',
      '我会一直在这里陪着你的！'
    ],
    zh_TW: [
      '今天也是美好的一天～',
      '歡迎來到 Shirine！',
      '有什麼想和我聊聊的嗎？',
      '看文章累了就伸個懶腰吧！',
      '點擊右邊的按鈕可以返回頂部哦～',
      '我會一直在此陪著你的！'
    ],
    en: [
      'Today is going to be another wonderful day!',
      'Welcome to Shirine!',
      'Is there anything you would like to talk about?',
      'Tired of reading? Stretch and take a break!',
      'Click the button on the right to scroll back to the top~',
      'I will always be right here with you!'
    ],
    ja: [
      '今日も素敵な一日になりますように～',
      'Shirine へようこそ！',
      '何かお話ししたいことはありますか？',
      '記事を読んで疲れたら背伸びしてみてね！',
      '右のボタンを押すとページ一番上に戻れるよ～',
      'ずっとここで見守っているよ！'
    ]
  };
  var currentLang = 'zh_CN';

  var actionIcons = {
    talk: '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>',
    scrollToTop: '<svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>',
    sleep: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
    home: '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>'
  };

  function showSpeechBubble(quote) {
    // The parent positions speech in the viewport, outside transparent canvas padding.
    parent.postMessage({ type: 'l2d-speech', text: String(quote) }, location.origin);
  }

  var menuActions = {
    home: function() { parent.postMessage({ type: 'l2d-action', action: 'home' }, '*'); },
    scrollToTop: function() { parent.postMessage({ type: 'l2d-action', action: 'scrollToTop' }, '*'); },
    sleep: function(w) {
      if (w && typeof w.sleep === 'function') {
        w.sleep();
      }
      parent.postMessage({ type: 'l2d-sleep' }, '*');
    },
    talk: function(w) {
      var quotes = quotesByLang[currentLang] || quotesByLang.zh_CN;
      var quote = quotes[Math.floor(Math.random() * quotes.length)];
      showSpeechBubble(quote);
    }
  };

  function notifyLoaded() {
    if (widgetLoaded) parent.postMessage({ type: 'l2d-loaded', contentHeight: lastContentHeight }, location.origin);
  }

  function getWidgetHeight(size) {
    if (typeof size === 'number') return size;
    if (size && typeof size.height === 'number') return size.height;
    return 500;
  }

  var characterBounds = null;
  function measureContentHeight() {
    if (!widgetLoaded) return;
    var canvas = widgetInstance && widgetInstance.l2d && widgetInstance.l2d.getCanvas();
    if (!canvas || !canvas.width || !canvas.height) return;
    try {
      // One small alpha scan after loading/resizing. The bundled renderer preserves its buffer.
      var sample = document.createElement('canvas'); sample.width = 140; sample.height = 180;
      var ctx = sample.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0, 140, 180);
      var data = ctx.getImageData(0, 0, 140, 180).data;
      var left = 140, right = 0, top = 180, bottom = 0;
      for (var row = 0; row < 180; row++) for (var col = 0; col < 140; col++) {
        if (data[(row * 140 + col) * 4 + 3] > 40) { left = Math.min(left, col); right = Math.max(right, col); top = Math.min(top, row); bottom = Math.max(bottom, row); }
      }
      if (right <= left || bottom <= top) return;
      var rect = canvas.getBoundingClientRect();
      characterBounds = { x: rect.left + left / 140 * rect.width, y: rect.top + top / 180 * rect.height, width: (right - left + 1) / 140 * rect.width, height: (bottom - top + 1) / 180 * rect.height };
      parent.postMessage({ type: 'l2d-bounds', bounds: characterBounds }, location.origin);
    } catch (error) { console.warn('Could not measure mascot bounds', error); }
  }

  function scheduleLayoutMeasurement() {
    cancelAnimationFrame(layoutFrame);
    layoutFrame = requestAnimationFrame(measureContentHeight);
  }

  function observeWidgetLayout() {
    [100, 400, 1000].forEach(function(delay) { setTimeout(scheduleLayoutMeasurement, delay); });
    setTimeout(function() { var quotes = quotesByLang[currentLang] || quotesByLang.zh_CN; showSpeechBubble(quotes[Math.floor(Math.random() * quotes.length)]); }, 1100);
  }

  function hideAboutMenu() {
    if (document.getElementById('l2d-hide-about')) return;
    var style = document.createElement('style');
    style.id = 'l2d-hide-about';
    style.textContent = 'button[title="About"] { display: none !important; }';
    document.head.appendChild(style);
  }

  function applyButtonIcons(items) {
    var buttons = document.querySelectorAll('div[style*="flex-direction: column"] button');
    buttons.forEach(function(btn, index) {
      var item = items && items[index];
      if (item) {
        var action = item.action || '';
        var svg = actionIcons[action] || actionIcons[item.icon] || '';
        if (svg) {
          btn.innerHTML = svg;
          btn.title = item.label || '';
        }
      }
    });
  }

  function destroyWidget() {
    if (!widgetInstance) return;
    try {
      widgetInstance.destroy();
    } catch (err) {
      console.error('Failed to destroy Live2D widget:', err);
    }
    widgetInstance = null;
    widgetLoaded = false;
    if (layoutObserver) layoutObserver.disconnect();
    layoutObserver = null;
    cancelAnimationFrame(layoutFrame);
  }

  window.addEventListener('message', function(e) {
    if (e.source !== parent || e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'l2d-talk') { menuActions.talk(widgetInstance); return; }
    if (e.data.type === 'l2d-wake') {
      try {
        if (widgetInstance && typeof widgetInstance.wake === 'function') {
          widgetInstance.wake();
        } else if (widgetInstance && typeof widgetInstance.wakeUp === 'function') {
          widgetInstance.wakeUp();
        } else if (widgetInstance && typeof widgetInstance.show === 'function') {
          widgetInstance.show();
        }
      } catch (err) {}
      var canvas = document.querySelector('canvas');
      if (canvas) {
        canvas.style.display = 'block';
        canvas.style.pointerEvents = 'auto';
        if (canvas.parentElement) {
          canvas.parentElement.style.transform = 'translateY(0)';
          canvas.parentElement.style.opacity = '1';
          canvas.parentElement.style.pointerEvents = 'auto';
        }
      }
      var restTabs = document.querySelectorAll('div[style*="fixed"]');
      restTabs.forEach(function(el) {
        if (el.textContent && el.textContent.indexOf('正在休息') !== -1) {
          el.click();
        }
      });
      notifyLoaded();
      return;
    }
    if (e.data.type === 'l2d-config' && e.data.lang) {
      currentLang = e.data.lang;
      return;
    }
    if (e.data.type !== 'l2d-init') return;
    if (e.data.lang) {
      currentLang = e.data.lang;
    }
    var customQuotes = null;
    if (Array.isArray(e.data.quotes)) {
      customQuotes = e.data.quotes;
    } else if (typeof e.data.quotes === 'string') {
      customQuotes = e.data.quotes.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
    }
    if (customQuotes && customQuotes.length > 0) {
      quotesByLang[currentLang || 'zh_CN'] = customQuotes;
      quotesByLang.zh_CN = customQuotes;
    }
    var config = e.data.config;
    if (e.data.force) {
      activeConfigKey = '';
      loadingConfigKey = '';
    }
    var configKey = JSON.stringify({ config: config, lang: currentLang, quotes: e.data.quotes || [] });

    if (widgetInstance && activeConfigKey === configKey) {
      if (widgetLoaded) notifyLoaded();
      return;
    }

    if (loadingConfigKey === configKey) {
      return;
    }

    loadingConfigKey = configKey;
    if (widgetInstance) {
      destroyWidget();
    }

    // Inject custom dialogue quotes into model and config tips
    var activeQuotes = quotesByLang[currentLang] || quotesByLang.zh_CN || [];
    if (activeQuotes && activeQuotes.length > 0) {
      var targetModel = Array.isArray(config.model) ? config.model[0] : config.model;
      if (targetModel) {
        targetModel.tips = targetModel.tips || {};
        targetModel.tips.welcomeMessage = activeQuotes;
        targetModel.tips.messages = activeQuotes;
        targetModel.tips.idleTips = targetModel.tips.idleTips || {};
        targetModel.tips.idleTips.wordings = activeQuotes;
      }
      config.tips = config.tips || {};
      config.tips.welcomeMessage = activeQuotes;
      config.tips.messages = activeQuotes;
      config.tips.idleTips = config.tips.idleTips || {};
      config.tips.idleTips.wordings = activeQuotes;
    }

    var originalItems = (config.menus && config.menus.items) ? [...config.menus.items] : [];

    if (config.menus && config.menus.items) {
      config.menus.items = config.menus.items.map(function(item) {
        return {
          icon: item.icon,
          label: item.label,
          onClick: function(w) {
            if (menuActions[item.action]) {
              menuActions[item.action](w);
            }
          }
        };
      });
    }

    try {
      widgetInstance = L2D_WIDGET.createWidget(config);
      activeConfigKey = configKey;
      baseContentHeight = getWidgetHeight(config.size);
      lastContentHeight = baseContentHeight;
      setTimeout(function() {
        applyButtonIcons(originalItems);
      }, 50);
    } catch (err) {
      loadingConfigKey = '';
      activeConfigKey = '';
      console.error('Failed to initialize Live2D widget:', err);
      parent.postMessage({ type: 'l2d-error' }, location.origin);
      return;
    }
    loadingConfigKey = '';

    var currentWidget = widgetInstance;

    if (config._hideAbout) {
      hideAboutMenu();
    }

    if (widgetInstance && widgetInstance.l2d) {
      widgetInstance.l2d.on('loaded', function() {
        if (widgetInstance !== currentWidget) return;
        widgetLoaded = true;
        applyButtonIcons(originalItems);
        notifyLoaded();
        observeWidgetLayout();
        scheduleLayoutMeasurement();
      });
      if (widgetInstance.l2d.isLoaded || widgetInstance.l2d.model) {
        widgetLoaded = true;
        applyButtonIcons(originalItems);
        notifyLoaded();
      }
    }

    setTimeout(function() {
      if (!widgetLoaded && widgetInstance === currentWidget) {
        parent.postMessage({ type: 'l2d-error' }, location.origin);
      }
    }, 15000);
  });

  window.addEventListener('resize', scheduleLayoutMeasurement);
  parent.postMessage({ type: 'l2d-ready' }, location.origin);
</script>
</body>
</html>
