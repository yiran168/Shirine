<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  /* Speech bubble sitting neatly right above the Live2D character's head */
  div[style*="calc(100%"] {
    bottom: calc(100% - 50px) !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    max-width: 220px !important;
    pointer-events: none !important;
    z-index: 99999 !important;
  }
  div[style*="calc(100%"] > div {
    background: rgba(26, 26, 36, 0.92) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.25) !important;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4) !important;
    border-radius: 12px !important;
    color: #ffffff !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1.5 !important;
    padding: 8px 12px !important;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6) !important;
  }
  div[style*="calc(100%"] > div > div[style*="border-top"] {
    border-top-color: rgba(26, 26, 36, 0.92) !important;
  }

  /* Right-side menu buttons strictly within bounds */
  div[style*="display: flex"][style*="flex-direction: column"] {
    right: 8px !important;
    max-width: 32px !important;
  }
  div[style*="display: flex"][style*="flex-direction: column"] button {
    width: 28px !important;
    height: 28px !important;
    border-radius: 50% !important;
    overflow: hidden !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
    font-size: 0 !important; /* Hide any raw text overflow */
  }
  div[style*="display: flex"][style*="flex-direction: column"] button svg {
    width: 15px !important;
    height: 15px !important;
    pointer-events: none !important;
    fill: currentColor !important;
  }
</style>
</head>
<body>
<script src="/pio/l2d-widget.min.js"></script>
<script>
  var widgetInstance = null;
  var activeConfigKey = '';
  var loadingConfigKey = '';
  var widgetLoaded = false;
  var baseContentHeight = 500;
  var lastContentHeight = 500;
  var floatingContentPadding = 12;
  var layoutObserver = null;
  var layoutFrame = 0;

  var quotesByLang = {
    zh_CN: [
      '今天也是美好的一天～',
      '欢迎来到 Shirine！',
      '有什么想和我聊聊的吗？',
      '看文章累了就伸个懒腰吧！',
      '点击右边的按钮可以返回顶部哦～',
      '我会一直在这里陪着你的！'
    ],
    zh_TW: [
      '今天也是美好的一天～',
      '歡迎來到 Shirine！',
      '有什麼想和我聊聊的嗎？',
      '看文章累了就伸個懶腰吧！',
      '點擊右邊的按鈕可以返回頂部哦～',
      '我會一直在此陪著你的！'
    ],
    en: [
      'Today is going to be another wonderful day!',
      'Welcome to Shirine!',
      'Is there anything you would like to talk about?',
      'Tired of reading? Stretch and take a break!',
      'Click the button on the right to scroll back to the top~',
      'I will always be right here with you!'
    ],
    ja: [
      '今日も素敵な一日になりますように～',
      'Shirine へようこそ！',
      '何かお話ししたいことはありますか？',
      '記事を読んで疲れたら背伸びしてみてね！',
      '右のボタンを押すとページ一番上に戻れるよ～',
      'ずっとここで見守っているよ！'
    ]
  };
  var currentLang = 'zh_CN';

  var actionIcons = {
    talk: '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>',
    scrollToTop: '<svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>',
    sleep: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
    home: '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>'
  };

  var menuActions = {
    home: function() { parent.postMessage({ type: 'l2d-action', action: 'home' }, '*'); },
    scrollToTop: function() { parent.postMessage({ type: 'l2d-action', action: 'scrollToTop' }, '*'); },
    sleep: function(w) { w.sleep(); },
    talk: function(w) {
      var quotes = quotesByLang[currentLang] || quotesByLang.zh_CN;
      var quote = quotes[Math.floor(Math.random() * quotes.length)];
      var tipSpan = document.querySelector('div[style*="calc(100%"] span');
      if (tipSpan) {
        tipSpan.textContent = quote;
        var bubble = tipSpan.parentElement;
        if (bubble) {
          bubble.style.opacity = '1';
          bubble.style.animation = 'l2dw-tips-float 2.5s ease-in-out infinite';
          setTimeout(function() {
            if (bubble) bubble.style.opacity = '0';
          }, 3500);
        }
      }
    }
  };

  function notifyLoaded() {
    parent.postMessage({ type: 'l2d-loaded', contentHeight: lastContentHeight }, '*');
  }

  function getWidgetHeight(size) {
    if (typeof size === 'number') return size;
    if (size && typeof size.height === 'number') return size.height;
    return 500;
  }

  function measureContentHeight() {
    if (!widgetLoaded) return;

    var viewportHeight = window.innerHeight;
    var minTop = viewportHeight - baseContentHeight;
    document.body.querySelectorAll('*').forEach(function(el) {
      if (!el.getBoundingClientRect || /^(SCRIPT|STYLE)$/.test(el.tagName)) return;
      var style = getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) return;
      var paintsBox =
        !/^(transparent|rgba\(0, 0, 0, 0\))$/.test(style.backgroundColor) ||
        style.backgroundImage !== 'none' ||
        style.boxShadow !== 'none';
      if (!paintsBox) return;
      var rect = el.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0 && rect.top < minTop) minTop = rect.top;
    });

    var measuredHeight = Math.ceil(viewportHeight - minTop);
    var nextHeight = measuredHeight > baseContentHeight
      ? measuredHeight + floatingContentPadding
      : baseContentHeight;
    if (nextHeight === lastContentHeight) return;
    lastContentHeight = nextHeight;
    notifyLoaded();
  }

  function scheduleLayoutMeasurement() {
    cancelAnimationFrame(layoutFrame);
    layoutFrame = requestAnimationFrame(measureContentHeight);
  }

  function observeWidgetLayout() {
    if (layoutObserver) layoutObserver.disconnect();
    layoutObserver = new MutationObserver(scheduleLayoutMeasurement);
    layoutObserver.observe(document.body, {
      subtree: true,
      childList: true,
      characterData: true,
      attributes: true,
      attributeFilter: ['class', 'style'],
    });
  }

  function hideAboutMenu() {
    if (document.getElementById('l2d-hide-about')) return;
    var style = document.createElement('style');
    style.id = 'l2d-hide-about';
    style.textContent = 'button[title="About"] { display: none !important; }';
    document.head.appendChild(style);
  }

  function applyButtonIcons(items) {
    var buttons = document.querySelectorAll('div[style*="flex-direction: column"] button');
    buttons.forEach(function(btn, index) {
      var item = items && items[index];
      if (item) {
        var action = item.action || '';
        var svg = actionIcons[action] || actionIcons[item.icon] || '';
        if (svg) {
          btn.innerHTML = svg;
          btn.title = item.label || '';
        }
      }
    });
  }

  function destroyWidget() {
    if (!widgetInstance) return;
    try {
      widgetInstance.destroy();
    } catch (err) {
      console.error('Failed to destroy Live2D widget:', err);
    }
    widgetInstance = null;
    widgetLoaded = false;
    if (layoutObserver) layoutObserver.disconnect();
    layoutObserver = null;
    cancelAnimationFrame(layoutFrame);
  }

  // Dragging support inside iframe using screen coordinates (invariant to container motion)
  var isDragging = false;
  var startScreenX = 0;
  var startScreenY = 0;

  function onDragStart(e) {
    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
    isDragging = true;
    var pt = e.touches ? e.touches[0] : e;
    startScreenX = pt.screenX;
    startScreenY = pt.screenY;
  }

  function onDragMove(e) {
    if (!isDragging) return;
    var pt = e.touches ? e.touches[0] : e;
    var dx = pt.screenX - startScreenX;
    var dy = pt.screenY - startScreenY;
    if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) {
      parent.postMessage({ type: 'l2d-drag', dx: dx, dy: dy }, '*');
      startScreenX = pt.screenX;
      startScreenY = pt.screenY;
    }
  }

  function onDragEnd() {
    isDragging = false;
  }

  window.addEventListener('mousedown', onDragStart);
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
  window.addEventListener('touchstart', onDragStart, { passive: true });
  window.addEventListener('touchmove', onDragMove, { passive: true });
  window.addEventListener('touchend', onDragEnd);
  window.addEventListener('touchcancel', onDragEnd);
  window.addEventListener('blur', onDragEnd);

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'l2d-config' && e.data.lang) {
      currentLang = e.data.lang;
      return;
    }
    if (e.data.type !== 'l2d-init') return;
    if (e.data.lang) {
      currentLang = e.data.lang;
    }
    if (e.data.quotes && Array.isArray(e.data.quotes) && e.data.quotes.length > 0) {
      quotesByLang[currentLang || 'zh_CN'] = e.data.quotes;
    }
    var config = e.data.config;
    var configKey = JSON.stringify(config);

    if (widgetInstance && activeConfigKey === configKey) {
      if (widgetLoaded) notifyLoaded();
      return;
    }

    if (loadingConfigKey === configKey) {
      return;
    }

    loadingConfigKey = configKey;
    if (widgetInstance) {
      destroyWidget();
    }

    var originalItems = (config.menus && config.menus.items) ? [...config.menus.items] : [];

    if (config.menus && config.menus.items) {
      config.menus.items = config.menus.items.map(function(item) {
        return {
          icon: item.icon,
          label: item.label,
          onClick: function(w) {
            if (menuActions[item.action]) {
              menuActions[item.action](w);
            }
          }
        };
      });
    }

    try {
      widgetInstance = L2D_WIDGET.createWidget(config);
      activeConfigKey = configKey;
      baseContentHeight = getWidgetHeight(config.size);
      lastContentHeight = baseContentHeight;
      setTimeout(function() {
        applyButtonIcons(originalItems);
      }, 50);
    } catch (err) {
      loadingConfigKey = '';
      activeConfigKey = '';
      console.error('Failed to initialize Live2D widget:', err);
      return;
    }
    loadingConfigKey = '';

    if (config._hideAbout) {
      hideAboutMenu();
    }

    widgetInstance.l2d.on('loaded', function() {
      widgetLoaded = true;
      applyButtonIcons(originalItems);
      notifyLoaded();
      observeWidgetLayout();
      scheduleLayoutMeasurement();
    });
  });

  window.addEventListener('resize', scheduleLayoutMeasurement);
</script>
</body>
</html>
