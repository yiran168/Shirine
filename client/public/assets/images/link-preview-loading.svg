<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>

    <linearGradient id="cloudShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="glowDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* 12-15 fps animation cadence */
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }

    @keyframes waveArm {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-10deg); }
    }

    @keyframes blinkEye {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(45deg); opacity: 1; }
    }

    @keyframes petalDrift {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translate(-30px, 60px) rotate(120deg); opacity: 0; }
    }

    @keyframes progressBarAnim {
      0% { transform: translateX(-160px); width: 60px; }
      50% { width: 140px; }
      100% { transform: translateX(330px); width: 70px; }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes dotFade1 {
      0%, 20% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    @keyframes dotFade2 {
      0%, 40% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    @keyframes dotFade3 {
      0%, 60% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }

    .cloud-group { animation: floatCloud 3.5s ease-in-out infinite; }
    .mascot-group { animation: floatMascot 3.5s ease-in-out infinite; transform-origin: 256px 200px; }
    .arm-wave { animation: waveArm 2s ease-in-out infinite; transform-origin: 295px 190px; }
    .eye-blink { animation: blinkEye 3.8s infinite; transform-origin: 256px 165px; }
    .star-twinkle-1 { animation: twinkle 2.2s infinite; transform-origin: 160px 110px; }
    .star-twinkle-2 { animation: twinkle 2.8s infinite 0.8s; transform-origin: 360px 100px; }
    .star-twinkle-3 { animation: twinkle 2.4s infinite 1.4s; transform-origin: 370px 240px; }
    .petal-1 { animation: petalDrift 4s linear infinite; }
    .petal-2 { animation: petalDrift 4.5s linear infinite 1.5s; }
    .progress-bar-runner { animation: progressBarAnim 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .dot-1 { animation: dotFade1 1.8s infinite; }
    .dot-2 { animation: dotFade2 1.8s infinite; }
    .dot-3 { animation: dotFade3 1.8s infinite; }
  </style>

  <!-- Upper Tier: Mascot on Cloud -->
  <g class="cloud-group">
    <!-- Star Sparkles -->
    <path class="star-twinkle-1" d="M160 102 L162 108 L168 110 L162 112 L160 118 L158 112 L152 110 L158 108 Z" fill="#f472b6" filter="url(#starGlow)"/>
    <path class="star-twinkle-2" d="M360 92 L362 98 L368 100 L362 102 L360 108 L358 102 L352 100 L358 98 Z" fill="#c084fc" filter="url(#starGlow)"/>
    <path class="star-twinkle-3" d="M370 232 L372 238 L378 240 L372 242 L370 248 L368 242 L362 240 L368 238 Z" fill="#fb7185" filter="url(#starGlow)"/>

    <!-- Falling Petals -->
    <path class="petal-1" d="M170 150 C165 140 150 145 155 155 C160 165 175 160 170 150 Z" fill="#f472b6" opacity="0.7"/>
    <path class="petal-2" d="M340 130 C335 120 320 125 325 135 C330 145 345 140 340 130 Z" fill="#ec4899" opacity="0.7"/>

    <!-- Fluffy Cloud -->
    <g filter="url(#softGlow)">
      <path d="M150 310 C125 310 105 290 105 265 C105 245 120 230 138 226 C145 198 175 180 208 182 C222 170 242 165 265 167 C292 167 315 180 326 200 C340 200 355 210 362 225 C382 228 398 245 398 268 C398 292 378 310 352 310 Z" fill="url(#cloudShadow)"/>
      <path d="M145 302 C122 302 108 285 108 262 C108 245 120 232 136 228 C144 202 170 185 200 188 C214 175 234 170 255 172 C280 172 302 184 314 202 C328 202 342 212 350 226 C368 228 384 245 384 265 C384 288 365 305 342 305 Z" fill="url(#cloudGrad)"/>
    </g>
  </g>

  <!-- Mascot -->
  <g class="mascot-group">
    <!-- Hair back -->
    <path d="M195 160 C175 200 170 240 185 260 C195 240 200 210 205 180 Z" fill="url(#hairGrad)"/>
    <path d="M317 160 C337 200 342 240 327 260 C317 240 312 210 307 180 Z" fill="url(#hairGrad)"/>

    <!-- Body / Dress -->
    <path d="M216 235 C216 220 232 210 256 210 C280 210 296 220 296 235 L306 278 C306 284 294 290 256 290 C218 290 206 284 206 278 Z" fill="url(#dressGrad)"/>
    <!-- Ribbon -->
    <path d="M236 225 L256 235 L276 225 L266 242 L256 238 L246 242 Z" fill="url(#ribbonGrad)"/>
    <circle cx="256" cy="235" r="4" fill="#fbbf24"/>

    <!-- Head -->
    <ellipse cx="256" cy="180" rx="46" ry="42" fill="#fff1f2"/>
    <!-- Cheeks -->
    <ellipse cx="226" cy="190" rx="6" ry="3.5" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="286" cy="190" rx="6" ry="3.5" fill="#fda4af" opacity="0.6"/>
    <!-- Mouth -->
    <path d="M251 195 Q256 199 261 195" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <g class="eye-blink">
      <ellipse cx="234" cy="178" rx="7" ry="10" fill="#374151"/>
      <ellipse cx="278" cy="178" rx="7" ry="10" fill="#374151"/>
      <circle cx="232" cy="175" r="3" fill="#ffffff"/>
      <circle cx="276" cy="175" r="3" fill="#ffffff"/>
      <circle cx="236" cy="182" r="1.5" fill="#ffffff"/>
      <circle cx="280" cy="182" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Front Bangs -->
    <path d="M210 165 C215 145 230 138 256 138 C282 138 297 145 302 165 C295 175 285 160 275 172 C265 155 255 170 245 158 C235 172 225 160 218 175 C212 172 210 168 210 165 Z" fill="url(#hairGrad)"/>

    <!-- Waving Arm -->
    <g class="arm-wave">
      <path d="M292 230 C305 225 318 215 328 205 C332 201 336 205 332 210 C322 222 312 232 298 238 Z" fill="url(#dressGrad)"/>
      <circle cx="330" cy="204" r="6" fill="#fff1f2"/>
    </g>
  </g>

  <!-- Lower Tier: Independent Progress Bar & Typography -->
  <g id="lower-tier">
    <!-- Progress Bar Container -->
    <rect x="96" y="420" width="320" height="12" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
    <rect x="98" y="422" width="316" height="8" rx="4" fill="#fce7f3" opacity="0.5"/>

    <!-- Animated Progress Bar Runner -->
    <g clip-path="url(#barClip)">
      <rect class="progress-bar-runner" x="96" y="421" width="120" height="10" rx="5" fill="url(#progressGrad)" filter="url(#softGlow)"/>
    </g>
    <clipPath id="barClip">
      <rect x="97" y="421" width="318" height="10" rx="5"/>
    </clipPath>

    <!-- "加载中" with 3 glowing dots -->
    <g transform="translate(256, 460)">
      <text text-anchor="middle" font-family="'PingFang SC', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#ec4899">
        加载中<tspan class="dot-1 dotPulse">.</tspan><tspan class="dot-2 dotPulse">.</tspan><tspan class="dot-3 dotPulse">.</tspan>
      </text>
    </g>
  </g>
</svg>
