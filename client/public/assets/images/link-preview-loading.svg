<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>

    <linearGradient id="cloudShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="glowDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* 12-15 fps animation cadence */
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }

    @keyframes waveArm {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-18deg); }
      75% { transform: rotate(12deg); }
    }

    @keyframes blinkEye {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }

    @keyframes petalDrift1 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% { transform: translate(-35px, 60px) rotate(120deg); opacity: 0; }
    }

    @keyframes petalDrift2 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      25% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translate(40px, 65px) rotate(-140deg); opacity: 0; }
    }

    @keyframes progressBarAnim {
      0% { transform: translateX(-240px); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(320px); }
    }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1.3); opacity: 1; }
    }

    .cloud-group { animation: floatCloud 3s ease-in-out infinite; transform-origin: 256px 230px; }
    .mascot-group { animation: floatMascot 3s ease-in-out infinite; transform-origin: 256px 200px; }
    .waving-arm { animation: waveArm 1.6s ease-in-out infinite; transform-origin: 288px 185px; }
    .eye-blink { animation: blinkEye 3.6s infinite; transform-origin: center; }
    .star-1 { animation: twinkle 1.8s ease-in-out infinite; transform-origin: 120px 100px; }
    .star-2 { animation: twinkle 2.2s ease-in-out infinite 0.6s; transform-origin: 390px 120px; }
    .star-3 { animation: twinkle 2.0s ease-in-out infinite 1.1s; transform-origin: 160px 220px; }
    .star-4 { animation: twinkle 2.4s ease-in-out infinite 0.3s; transform-origin: 360px 240px; }
    .petal-1 { animation: petalDrift1 3.2s ease-in-out infinite; }
    .petal-2 { animation: petalDrift2 3.8s ease-in-out infinite 1.4s; }
    .progress-bar-slider { animation: progressBarAnim 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .dot-1 { animation: dotPulse 1.4s infinite 0.0s; transform-origin: center; }
    .dot-2 { animation: dotPulse 1.4s infinite 0.25s; transform-origin: center; }
    .dot-3 { animation: dotPulse 1.4s infinite 0.5s; transform-origin: center; }
  </style>

  <!-- BACKGROUND HALO -->
  <circle cx="256" cy="180" r="140" fill="#fdf2f8" opacity="0.6"/>
  <circle cx="256" cy="180" r="110" fill="#fae8ff" opacity="0.5"/>

  <!-- FLOATING STARS -->
  <g class="star-1" filter="url(#starGlow)">
    <path d="M120 90 Q120 100 110 100 Q120 100 120 110 Q120 100 130 100 Q120 100 120 90 Z" fill="#fbbf24"/>
  </g>
  <g class="star-2" filter="url(#starGlow)">
    <path d="M390 110 Q390 120 380 120 Q390 120 390 130 Q390 120 400 120 Q390 120 390 110 Z" fill="#f472b6"/>
  </g>
  <g class="star-3" filter="url(#starGlow)">
    <path d="M160 215 Q160 222 153 222 Q160 222 160 229 Q160 222 167 222 Q160 222 160 215 Z" fill="#c084fc"/>
  </g>
  <g class="star-4" filter="url(#starGlow)">
    <path d="M360 235 Q360 242 353 242 Q360 242 360 249 Q360 242 367 242 Q360 242 360 235 Z" fill="#fbbf24"/>
  </g>

  <!-- FLOATING SAKURA PETALS -->
  <g class="petal-1">
    <path d="M170 120 C165 112 175 106 182 113 C188 120 180 130 170 120 Z" fill="#fbcfe8" opacity="0.85"/>
  </g>
  <g class="petal-2">
    <path d="M330 130 C338 122 346 128 342 136 C338 144 326 138 330 130 Z" fill="#f472b6" opacity="0.8"/>
  </g>

  <!-- CLOUD BASE (Upper Half) -->
  <g class="cloud-group">
    <!-- Cloud Shadow -->
    <path d="M150 250 C125 250 105 230 115 205 C110 180 135 160 160 165 C175 140 215 135 240 155 C265 130 310 135 325 160 C350 155 375 175 370 200 C390 215 385 245 360 250 C330 258 180 258 150 250 Z"
          fill="url(#cloudShadow)" opacity="0.4" transform="translate(0, 10) scale(1.04)"/>
    
    <!-- Cloud Main Body -->
    <ellipse cx="256" cy="240" rx="130" ry="42" fill="url(#cloudGrad)"/>
    <circle cx="165" cy="225" r="46" fill="url(#cloudGrad)"/>
    <circle cx="215" cy="205" r="50" fill="url(#cloudGrad)"/>
    <circle cx="295" cy="205" r="52" fill="url(#cloudGrad)"/>
    <circle cx="345" cy="225" r="46" fill="url(#cloudGrad)"/>
    <!-- Cloud Soft Highlight -->
    <ellipse cx="256" cy="220" rx="90" ry="18" fill="#ffffff" opacity="0.7"/>
    <!-- Small Cloud Puffs -->
    <circle cx="130" cy="242" r="22" fill="url(#cloudGrad)"/>
    <circle cx="380" cy="242" r="22" fill="url(#cloudGrad)"/>
  </g>

  <!-- CHIBI MASCOT (Shirine) -->
  <g class="mascot-group">
    <!-- Back Hair / Twintails -->
    <path d="M195 160 C175 170 160 210 170 240 C175 255 185 245 185 230 C185 205 195 180 205 170 Z" fill="url(#hairGrad)"/>
    <path d="M317 160 C337 170 352 210 342 240 C337 255 327 245 327 230 C327 205 317 180 307 170 Z" fill="url(#hairGrad)"/>

    <!-- Mascot Body / Dress -->
    <path d="M230 185 Q220 220 215 235 Q256 242 297 235 Q292 220 282 185 Z" fill="url(#dressGrad)"/>
    <!-- Dress Ribbon & Trim -->
    <path d="M238 185 Q256 195 274 185 Q265 210 238 185 Z" fill="url(#ribbonGrad)"/>
    <circle cx="256" cy="190" r="5" fill="#fbcfe8"/>

    <!-- Head / Face -->
    <ellipse cx="256" cy="155" rx="42" ry="38" fill="#fff1f2"/>

    <!-- Blush Cheeks -->
    <ellipse cx="230" cy="165" rx="8" ry="4" fill="#f472b6" opacity="0.65"/>
    <ellipse cx="282" cy="165" rx="8" ry="4" fill="#f472b6" opacity="0.65"/>

    <!-- Eyes (with blinking animation) -->
    <g class="eye-blink">
      <!-- Left Eye -->
      <ellipse cx="236" cy="152" rx="7.5" ry="9" fill="#1e1b4b"/>
      <ellipse cx="236" cy="154" rx="6" ry="7" fill="#7c3aed"/>
      <circle cx="233" cy="148" r="3" fill="#ffffff"/>
      <circle cx="238" cy="156" r="1.5" fill="#ffffff"/>
      <path d="M228 142 Q236 138 244 142" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>

      <!-- Right Eye -->
      <ellipse cx="276" cy="152" rx="7.5" ry="9" fill="#1e1b4b"/>
      <ellipse cx="276" cy="154" rx="6" ry="7" fill="#7c3aed"/>
      <circle cx="273" cy="148" r="3" fill="#ffffff"/>
      <circle cx="278" cy="156" r="1.5" fill="#ffffff"/>
      <path d="M268 142 Q276 138 284 142" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sweet Smile -->
    <path d="M251 168 Q256 173 261 168" stroke="#db2777" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Front Hair / Bangs -->
    <path d="M214 150 C212 125 230 115 256 115 C282 115 300 125 298 150 C290 140 280 135 272 145 C264 135 250 135 244 145 C236 135 224 140 214 150 Z" fill="url(#hairGrad)"/>
    <!-- Ahoge / Cowlick on top -->
    <path d="M256 115 Q262 90 275 88 Q264 100 258 114 Z" fill="url(#hairGrad)"/>

    <!-- Hair Accessories: Lilac Bows -->
    <path d="M210 140 Q200 135 204 146 Q210 144 214 145 Z" fill="url(#ribbonGrad)"/>
    <circle cx="212" cy="143" r="3" fill="#fde047"/>
    <path d="M302 140 Q312 135 308 146 Q302 144 298 145 Z" fill="url(#ribbonGrad)"/>
    <circle cx="300" cy="143" r="3" fill="#fde047"/>

    <!-- Left Resting Arm -->
    <path d="M228 190 Q215 205 225 215" stroke="#fff1f2" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Waving Arm with Star Wand -->
    <g class="waving-arm">
      <path d="M284 190 Q305 180 315 165" stroke="#fff1f2" stroke-width="8" stroke-linecap="round"/>
      <!-- Tiny Hand -->
      <circle cx="316" cy="164" r="5" fill="#fff1f2"/>
      <!-- Mini Star Wand -->
      <line x1="316" y1="164" x2="330" y2="148" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M332 144 Q332 148 328 148 Q332 148 332 152 Q332 148 336 148 Q332 148 332 144 Z" fill="#f43f5e" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- ================= LOWER HALF ================= -->
  <!-- Rounded Pink-to-Purple Gradient Loading Progress Bar -->
  <g id="progressBarGroup" transform="translate(86, 350)">
    <!-- Outer Bar Container (Rounded) -->
    <rect x="0" y="0" width="340" height="18" rx="9" ry="9" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
    
    <!-- Inner Clipping mask for sliding gradient -->
    <g clip-path="url(#progressClip)">
      <clipPath id="progressClip">
        <rect x="3" y="3" width="334" height="12" rx="6" ry="6"/>
      </clipPath>
      
      <!-- Gradient Track Layer -->
      <rect x="3" y="3" width="334" height="12" rx="6" ry="6" fill="#fce7f3" opacity="0.6"/>

      <!-- Animated Sliding Gradient Bar -->
      <rect class="progress-bar-slider" x="0" y="3" width="200" height="12" rx="6" ry="6" fill="url(#progressGrad)" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- "加载中…" Text with 3 Glowing Pulsing Dots -->
  <g transform="translate(256, 415)" text-anchor="middle">
    <!-- Anime-style typography with glowing shadow -->
    <text x="-25" y="0" fill="#db2777" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="3" filter="url(#softGlow)">
      加载中
    </text>
    <text x="-25" y="0" fill="#ec4899" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="3">
      加载中
    </text>

    <!-- 3 Glowing Dots -->
    <g transform="translate(32, -6)">
      <!-- Dot 1 -->
      <circle class="dot-1" cx="0" cy="0" r="4.5" fill="url(#glowDotGrad)" filter="url(#starGlow)"/>
      <circle class="dot-1" cx="0" cy="0" r="3.5" fill="#f472b6"/>

      <!-- Dot 2 -->
      <circle class="dot-2" cx="16" cy="0" r="4.5" fill="url(#glowDotGrad)" filter="url(#starGlow)"/>
      <circle class="dot-2" cx="16" cy="0" r="3.5" fill="#c084fc"/>

      <!-- Dot 3 -->
      <circle class="dot-3" cx="32" cy="0" r="4.5" fill="url(#glowDotGrad)" filter="url(#starGlow)"/>
      <circle class="dot-3" cx="32" cy="0" r="3.5" fill="#818cf8"/>
    </g>
  </g>

  <!-- Subtitle note -->
  <text x="256" y="448" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-weight="500" font-size="12" letter-spacing="1">
    Shirine Expressive Preview
  </text>
</svg>
